name: Build and Release YTMusicNxt

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted IPA file"
        default: ""
        required: true
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "YouTube Music"
        required: true
        type: string

      bundle_id:
        description: "BundleID (Optional)"
        default: "com.google.ios.youtubemusic"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YTMusicNxt
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@v6.0.2
        with:
          path: main
          submodules: recursive

      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: bundle_id,display_name

      - name: Validate IPA URL
        run: |
          curl -L -r 0-1023 -o sample.part "${{ inputs.ipa_url }}" > /dev/null 2>&1

          file_type=$(file --mime-type -b sample.part)

          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The file is not a valid IPA file. Detected type: $file_type."
            exit 1
          fi

      - name: Install Dependencies
        run: brew install make ldid

      - name: Set PATH environment variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Cache Theos
        id: theos
        uses: actions/cache@v5.0.3
        env:
          cache-name: theos_cache_344ee59
        with:
          path: theos/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Setup Theos
        if: steps.theos.outputs.cache-hit != 'true'
        uses: actions/checkout@v6.0.2
        with:
          repository: theos/theos
          ref: 344ee5925df036dbd1312b783ad5a00d153c2445
          path: theos
          submodules: recursive

      - name: Download iOS SDK
        if: steps.theos.outputs.cache-hit != 'true'
        run: |
          # Pinned: unpinned dependencies mean a build can change under you.
          SDK_REF=0222fd5413cf4b9af096f37b4621afa2688572f7
          mkdir -p sdks && cd sdks
          git init -q
          git remote add origin https://github.com/theos/sdks.git
          git config core.sparseCheckout true
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git fetch --quiet --depth=1 origin "$SDK_REF"
          git checkout -q FETCH_HEAD
          mv *.sdk $THEOS/sdks

      - name: Install cyan
        run: |
          # Pinned for the same reason. This is the step that rewrites and signs
          # the IPA, so an unpinned main is the riskiest dependency here.
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/740d3716dcd98c20c000f12cdb88f1f0b2a533a4.zip

      - name: Download YouTube Music
        run: wget "${{ inputs.ipa_url }}" --no-verbose -O ytm.ipa

      - name: Build Tweak for Sideloading
        run: |
          cd main
          # -j1: parallel builds trip spurious module errors in the ObjC++
          # sources with a modern clang against the theos 16.5 SDK.
          make clean package DEBUG=0 FINALPACKAGE=1 SIDELOADING=1 -j1
          test -n "$(ls packages/*.deb 2>/dev/null)" || { echo "::error::no deb produced"; exit 1; }
          mv packages/*.deb ../ytmult.deb

      - name: Inject tweak into provided IPA
        run: cyan -i ytm.ipa -o YTMusicNxt.ipa -uwsf ytmult.deb -n "${{ inputs.display_name }}" -b "${{ inputs.bundle_id }}"

      - name: Verify packaged IPA
        run: |
          # A green build is not proof the tweak is actually in the IPA, and a
          # silently-uninjected tweak ships as a broken download. Check it.
          set -euo pipefail
          rm -rf verify && mkdir verify
          unzip -q YTMusicNxt.ipa -d verify
          APP="verify/Payload/YouTubeMusic.app"

          fail() { echo "::error::$1"; exit 1; }

          [ -d "$APP" ] || fail "Payload/YouTubeMusic.app not found in IPA"
          [ -f "$APP/Frameworks/YTMusicUltimate.dylib" ] || fail "YTMusicUltimate.dylib not injected"
          [ -d "$APP/Frameworks/CydiaSubstrate.framework" ] || fail "CydiaSubstrate.framework not injected"

          otool -L "$APP/YouTubeMusic" | grep -q "YTMusicUltimate.dylib" \
            || fail "LC_LOAD_DYLIB for YTMusicUltimate.dylib is missing"

          actual_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          [ "$actual_id" = "${{ inputs.bundle_id }}" ] \
            || fail "bundle id is '$actual_id', expected '${{ inputs.bundle_id }}'"

          # The dylib must not carry a link-time dependency on iOS 26 symbols:
          # YouTube Music's minimum is iOS 16, so UIGlassEffect has to be
          # resolved at runtime or the tweak will not load on older systems.
          if nm -u "$APP/Frameworks/YTMusicUltimate.dylib" | grep -qiE "UIGlassEffect|UICornerConfiguration"; then
            fail "dylib has a link-time dependency on iOS 26 symbols"
          fi

          echo "IPA verified: $actual_id, $(stat -f%z "$APP/Frameworks/YTMusicUltimate.dylib") byte dylib"

      - name: Create Release
        uses: softprops/action-gh-release@v2.5.0
        with:
          name: YTMusicNxt (${{ github.run_number }})
          files: |
            YTMusicNxt.ipa
            ytmult.deb
          draft: true

      - name: Output Release URL
        run: |
          echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"